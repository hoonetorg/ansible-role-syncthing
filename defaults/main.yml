---
# Merged (recursively) with the inventory variable `syncthing` into `syncthing_final`.
syncthing_defaults:
  package: syncthing
  min_version: "2.0"
  # Python binding package_facts needs on the target (version check); empty: derived from the OS family
  # (vars/main.yml), e.g. python313-rpm on Leap 16.1; set it for other names (e.g. Leap 15: python3-rpm)
  facts_package: ""

  # system user running syncthing@<user>.service (required)
  user: ""
  # config/data dir; empty: <home of user>/.local/state/syncthing
  home: ""

  # name of this device (shown in the own GUI, suggested to other devices when they add it)
  name: "{{ inventory_hostname_short }}"

  # identity (PEM, required): the certificate defines the device ID
  cert: ""
  key: ""
  # API key used by this role (required)
  apikey: ""

  gui:
    address: "127.0.0.1:8384"
    tls: true
    user: ""          # empty: same as `user`
    password: ""      # plain text (required); syncthing stores the bcrypt hash

  # hide REST API requests/results (they carry the API key in a header); set false only for debugging,
  # then the API key appears on screen and in logs
  no_log: true

  # open the firewalld service "syncthing" (22000/tcp+udp, 21027/udp) when firewalld is running
  firewalld: true

  # managed devices/folders, see README.md; objects not listed here are left untouched
  devices: []
  folders: []

  # default for folders[].devices_exclusive: true = a folder is shared with exactly the listed devices
  # (others are removed); false = listed devices are only added
  folder_devices_exclusive: false
